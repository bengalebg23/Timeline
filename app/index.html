<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Family Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky control deck over one vertical date axis. Axis labels left, duration bars in lanes, event cards stacked right. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6775; --line:#D3DAE2; --accent:#2D4BD8;
  --c-holiday:#0E8A86; --c-work:#5B4FC7; --c-home:#A86F0E; --c-trip:#CF4339; --c-family:#B23A7A;
  --scrim:rgba(10,16,24,.45); --shadow:0 1px 2px rgba(16,24,40,.07),0 4px 14px rgba(16,24,40,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E6EBF0; --muted:#93A0AE; --line:#2A3542; --accent:#8196FF;
  --c-holiday:#3CC3BC; --c-work:#A39AF5; --c-home:#E7AE4A; --c-trip:#F07A70; --c-family:#EE7FB8;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E6EBF0; --muted:#93A0AE; --line:#2A3542; --accent:#8196FF;
  --c-holiday:#3CC3BC; --c-work:#A39AF5; --c-home:#E7AE4A; --c-trip:#F07A70; --c-family:#EE7FB8;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Deck */
.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line)}
.deck-in{max-width:760px;margin:0 auto;display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;margin:0;line-height:1.1}
.ver{font-family:var(--f-mono);font-size:.68rem;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px;vertical-align:middle;letter-spacing:0}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
#btn-menu{position:relative}
#btn-menu .sync-dot{position:absolute;top:5px;right:5px}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync-dot.ok{background:#2E9E5B}
.sync-dot.busy{background:#D69A1E}
.sync-dot.err{background:#D6453D}
.sync-dot.off{background:transparent;border:1.5px solid var(--muted)}
.sync-line{display:flex;align-items:center;gap:8px;margin:0;font-size:.9rem}
.controls{display:flex;gap:8px;align-items:center}
.seg{display:flex;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 4px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 8px;font-size:.84rem;font-weight:500}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="false"]{background:transparent;color:var(--muted);border-style:dashed}
.chip[aria-pressed="false"] .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}

/* Banners */
#banners{max-width:760px;margin:10px auto 0;display:grid;gap:8px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.88rem;color:var(--muted)}
.banner button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:2px 0}
.banner.warn{border-color:var(--c-trip);color:var(--ink)}

/* Timeline */
main{max-width:760px;margin:0 auto}
#timeline{position:relative;touch-action:pan-y;margin-top:4px}
.tick{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line);pointer-events:none}
.tick .lab{position:absolute;left:0;top:3px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick-year{border-top:2px solid var(--ink)}
.tick-year .lab{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink);top:4px;letter-spacing:-.01em}
.tick-month .lab{color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
.tick-week,.tick-day{right:auto;width:52px;border-top-style:dotted}
.tick-day.is-mon{border-top-style:solid}
.tick-day .lab{font-size:.62rem}
.bar{position:absolute;width:5px;border-radius:3px;background:var(--c)}
.bar.k-idea{opacity:.45}
.link{position:absolute;border-top:1.5px solid var(--c);opacity:.7;pointer-events:none}
.elbow{position:absolute;border-top:1.5px solid var(--c);border-right:1.5px solid var(--c);border-top-right-radius:6px;opacity:.7;pointer-events:none}
.today{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);z-index:2;pointer-events:none}
.today span{position:absolute;right:0;top:-11px;background:var(--accent);color:var(--bg);font-family:var(--f-mono);font-size:.64rem;padding:2px 7px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}

.card{position:absolute;left:100px;right:0;display:flex;align-items:stretch;gap:10px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;box-shadow:var(--shadow);z-index:1}
.card.k-idea{border-style:dashed;box-shadow:none}
.card.k-booked,.card.k-now{border-color:var(--c)}
.card .t{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .d{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.card .body{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;flex:1;padding:6px 10px 6px 0}
.card .row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.st,.ex,.alb{font-size:.7rem;font-weight:600;white-space:nowrap;border-radius:999px;padding:1px 7px}
.st{color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.k-past .st{color:var(--muted);background:transparent;padding-left:0}
.ex{color:var(--muted);border:1px dashed var(--line)}
.alb{color:var(--ink);border:1px solid var(--line)}
.cov{flex:none;display:block;background:var(--c);position:relative;overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 75%,var(--surface)) 0 8px,color-mix(in srgb,var(--c) 60%,var(--surface)) 8px 16px)}
.m-month .cov{width:62px}
.m-week .cov{width:108px}
.m-week .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:1rem;line-height:1.2}
.m-week .n{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.m-year{background:transparent;border:0;box-shadow:none;align-items:center;gap:7px;padding:0 4px;border-radius:6px}
.m-year .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.m-year.k-idea .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.m-year .t{font-size:.86rem;flex:0 1 auto;min-width:0}
.m-year .d{flex:none}
.tile{position:absolute;padding:0;border:2px solid var(--c);border-radius:8px;overflow:hidden;background:var(--c);box-shadow:var(--shadow);z-index:1}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.k-idea{border-style:dashed}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;text-align:left;display:grid;gap:1px}
.tile .cap b{font-weight:600;font-size:.74rem;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .cap i{font-style:normal;font-family:var(--f-mono);font-size:.6rem;opacity:.85}
.tile.s-M .cap{padding:10px 5px 3px}
.tile.s-M .cap b{font-size:.66rem;-webkit-line-clamp:1}
.more{position:absolute;left:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font-family:var(--f-mono);font-size:.62rem;padding:1px 6px;z-index:2}
.top-btns{display:flex;gap:8px}
.prio{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prio .ph-head{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 2px 2px;border-bottom:1px solid var(--line)}
.prio .ph-head small{text-transform:none;letter-spacing:0;font-weight:400}
.pi{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.pi .handle{touch-action:none;cursor:grab;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex:none;border:0;background:transparent}
.pi .handle svg{width:18px;height:18px;fill:currentColor}
.pi .thumb{width:44px;height:33px;border-radius:6px;overflow:hidden;background:var(--c);flex:none;position:relative;border:1.5px solid var(--c)}
.pi .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pi .pt{min-width:0;display:grid}
.pi .pt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .pt small{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.pi.dragging{position:fixed;z-index:40;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);background:var(--surface)}
.pi-gap{border:2px dashed var(--accent);border-radius:10px;list-style:none}
select.sel{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.empty{position:sticky;top:45%;margin:40px 0 0 100px;color:var(--muted);text-align:center;font-size:.9rem;z-index:3}

/* FAB */
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;padding:14px 20px;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:620px;margin:0 auto;display:grid;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sheet-in h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.det-cover{border-radius:12px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--c);position:relative}
.det-cover img{width:100%;height:100%;object-fit:cover;display:block}
a.det-cover{display:block;text-decoration:none}
.det-cover .go{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.62);color:#fff;font-weight:600;font-size:.8rem;padding:6px 11px;border-radius:999px}
.det-cover .go svg{width:14px;height:14px;fill:currentColor}
.det-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:.88rem}
.det-meta .d{font-family:var(--f-mono);font-size:.78rem}
.catpill{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.catpill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.notes{white-space:pre-wrap;margin:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--c-trip);border-color:color-mix(in srgb,var(--c-trip) 50%,var(--line))}
.btn.wide{flex:1;justify-content:center}
.url{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);word-break:break-all}
.field{display:grid;gap:5px}
.field > label,.legend{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input[type=text],.field input[type=url],.field input[type=email],.field input[type=password],.field input[type=date],.field textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:500;cursor:pointer}
.opts label .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.opts input:checked + label{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opts input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.err{color:var(--c-trip);font-size:.85rem;margin:0}
.img-pick{display:flex;gap:12px;align-items:center}
.img-prev{width:84px;height:64px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px dashed var(--line);flex:none;display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.img-prev img{width:100%;height:100%;object-fit:cover}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
textarea.copybox{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.72rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:.88rem;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Tally (secret, PIN-locked): full-width dot view, replaces the events while it's on */
h1{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--t0:#D6336C;--t1:#2F6FE4;--t2:#C98A06;--t3:#0F9B8E;--t4:#7B4FD0;--t5:#E8642C;--tx:#A3ADB8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t0:#F0659A;--t1:#6E9BFF;--t2:#F2B33D;--t3:#3CC9B9;--t4:#A98BF2;--t5:#FF8F5C;--tx:#5E6A77}}
:root[data-theme="dark"]{--t0:#F0659A;--t1:#6E9BFF;--t2:#F2B33D;--t3:#3CC9B9;--t4:#A98BF2;--t5:#FF8F5C;--tx:#5E6A77}
.tk-0{--c:var(--t0)} .tk-1{--c:var(--t1)} .tk-2{--c:var(--t2)} .tk-3{--c:var(--t3)} .tk-4{--c:var(--t4)} .tk-5{--c:var(--t5)} .tk-x{--c:var(--tx)}
.chip.ttags{border-style:solid;color:var(--accent);font-weight:600}
.tgrp{display:grid;gap:6px}
.tgrp h3{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 0}
.ttaglist{display:flex;flex-wrap:wrap;gap:6px}
.ttag{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:.88rem;color:var(--muted)}
.ttag .n{font-family:var(--f-mono);font-size:.72rem}
.ttag[aria-pressed="true"]{border:1px solid var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ttag[aria-pressed="true"]::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.trowb{position:absolute;left:56px;right:0;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:var(--g);padding:0;border:0;background:transparent;z-index:2;overflow:hidden}
.trowb i{width:var(--d);height:var(--d);border-radius:50%;background:var(--c);flex:none}
.trowb .n{font-family:var(--f-mono);font-size:.62rem;color:var(--muted);margin-left:4px}
.chip.tlg{border-color:transparent;background:transparent;padding-inline:4px}
.trowb.tod{display:block}
.trowb.tod i{position:absolute;top:50%;left:calc((100% - var(--d)) * var(--x));margin-top:calc(var(--d) / -2)}
.tgrid{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line);pointer-events:none}
.thr{position:absolute;font-family:var(--f-mono);font-size:.6rem;color:var(--muted);transform:translateX(-50%);pointer-events:none}
.tpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;width:100%}
.tpad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:1.35rem;font-weight:600}
.tpad span{display:block}
#tp-err{text-align:center;min-height:1.2em}
.tdots{display:flex;gap:12px;justify-content:center;min-height:14px}
.tdots i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted)}
.tdots i.f{background:var(--ink);box-shadow:none}
.tday{display:grid;gap:4px}
.tday h3{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 0}
.trow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.trow .tm{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.trow .tg{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.trow .tg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.trow .tx{grid-column:2;font-size:.84rem;color:var(--muted)}
</style>
</head>
<body>
<header class="deck">
  <div class="deck-in">
    <div class="top">
      <h1>Family Timeline <span class="ver" id="ver">v0.10.1</span></h1>
      <div class="top-btns"><button type="button" id="btn-prio" class="icon-btn" aria-label="Year view priorities"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="13" height="4" rx="1.5"/><rect x="3" y="16" width="8" height="4" rx="1.5"/></svg></button>
      <button type="button" id="btn-menu" class="icon-btn" aria-label="Backup, sync and settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="sync-dot" id="sync-dot" hidden></span></button></div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Zoom level">
        <button type="button" data-zoom="year">Years</button>
        <button type="button" data-zoom="month">Months</button>
        <button type="button" data-zoom="week">Weeks</button>
      </div>
      <button type="button" id="btn-today" class="ghost">Today</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Show categories"></div>
  </div>
</header>
<div id="banners"></div>
<main><div id="timeline" aria-label="Timeline of events"></div></main>
<button type="button" id="fab">+ Add</button>
<div id="scrim" hidden></div>
<section id="sheet" hidden role="dialog" aria-modal="true" aria-label="Event"></section>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
const VERSION = '0.10.1';
const DAY = 86400000;
const TOP = 28;
const CATS = {
  holiday:{label:'Holidays'},
  work:{label:'Work milestones'},
  home:{label:'Home improvements'},
  trip:{label:'Trips out'},
  family:{label:'Family moments'}
};
const CAT_SHORT = {holiday:'Holidays', work:'Work', home:'Home', trip:'Trips out', family:'Family'};
const STATUS = {idea:'Idea', planned:'Planned', booked:'Booked'};
const ZOOM = {year:2, month:9, week:48};
const CARD_H = {year:26, month:64, week:124};
const CARD_OFF = {year:13, month:18, week:18};
const GAP = {year:2, month:8, week:8};
const MIN_SCALE = 1.2, MAX_SCALE = 90;
const SIZES = {L:'Large', M:'Medium', S:'Small'};
const SIZE_ORDER = {L:0, M:1, S:2};
const MAX_SHIFT = {L:140, M:70, S:36};
function sizeOf(ev){ return SIZES[ev.size] ? ev.size : 'M'; }
function rankOf(ev){ return typeof ev.rank === 'number' ? ev.rank : 1e9; }
function prioCompare(a, b){
  return SIZE_ORDER[sizeOf(a)] - SIZE_ORDER[sizeOf(b)] || rankOf(a) - rankOf(b) || (a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
}

const tl = document.getElementById('timeline');
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');

/* ---------- small helpers ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){ /* storage unavailable */ } }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
function utc(s){ const p = String(s).split('-').map(Number); return Date.UTC(p[0], p[1]-1, p[2]); }
function isoOf(t){ return new Date(t).toISOString().slice(0,10); }
function todayUTC(){ const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
function fmt(t,o){ return new Intl.DateTimeFormat('en-GB', Object.assign({timeZone:'UTC'}, o)).format(new Date(t)); }
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function endOf(e){ return utc(e.end || e.start); }
function fmtRange(e){
  const s = utc(e.start), en = endOf(e);
  const S = new Date(s), E = new Date(en);
  if (en === s) return fmt(s,{weekday:'short', day:'numeric', month:'short', year:'numeric'});
  if (S.getUTCFullYear() === E.getUTCFullYear()){
    if (S.getUTCMonth() === E.getUTCMonth()) return S.getUTCDate() + '–' + fmt(en,{day:'numeric', month:'short', year:'numeric'});
    return fmt(s,{day:'numeric', month:'short'}) + ' – ' + fmt(en,{day:'numeric', month:'short', year:'numeric'});
  }
  return fmt(s,{day:'numeric', month:'short', year:'numeric'}) + ' – ' + fmt(en,{day:'numeric', month:'short', year:'numeric'});
}
function durationDays(e){ return Math.round((endOf(e) - utc(e.start)) / DAY) + 1; }
function statusInfo(e){
  const t = todayUTC(), s = utc(e.start), en = endOf(e);
  if (en < t) return {label:'Memory', kind:'past'};
  if (s <= t) return {label:'Happening now', kind:'now'};
  const days = Math.round((s - t) / DAY);
  const when = days === 1 ? 'tomorrow' : days < 60 ? 'in ' + days + ' days' : 'in ' + Math.round(days / 30.4) + ' months';
  const st = e.status && STATUS[e.status] ? e.status : 'planned';
  return {label: STATUS[st] + ' · ' + when, kind: st};
}
function modeOf(sc){ return sc < 4 ? 'year' : sc < 20 ? 'month' : 'week'; }
let toastTimer = 0;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/* ---------- storage (IndexedDB, on this device) ---------- */
let dbPromise = null;
let storageOK = true;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    let req;
    try { req = indexedDB.open('family-timeline', 1); } catch(err){ rej(err); return; }
    req.onupgradeneeded = () => { req.result.createObjectStore('events', {keyPath:'id'}); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return dbPromise;
}
async function dbAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction('events').objectStore('events').getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
async function dbWrite(fn){
  if (!storageOK) return;
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('events', 'readwrite');
    fn(tx.objectStore('events'));
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Save was cancelled'));
  });
}
// raw* write this phone only; dbPut/dbPutMany/dbDel also queue the change for cloud sync
const rawPutMany = list => list.length ? dbWrite(st => { list.forEach(item => st.put(item)); }) : Promise.resolve();
const rawDelMany = ids => ids.length ? dbWrite(st => { ids.forEach(i => st.delete(i)); }) : Promise.resolve();
const dbPutMany = list => {
  const now = Date.now();
  list.forEach(ev => { ev.updated = now; });
  return rawPutMany(list).then(() => syncQueue(list.map(ev => ev.id)));
};
const dbPut = ev => dbPutMany([ev]);
const dbDel = id => rawDelMany([id]).then(() => syncQueue([id], true));

/* ---------- images: stored as compressed JPEG data URLs, shown via blob URLs ---------- */
const imgCache = new Map();
function imgSrc(e){
  if (!e.img) return '';
  const hit = imgCache.get(e.id);
  if (hit && hit.src === e.img) return hit.url;
  if (hit && hit.url.startsWith('blob:')) URL.revokeObjectURL(hit.url);
  let url = e.img;
  try {
    const comma = e.img.indexOf(',');
    const mime = (e.img.slice(0, comma).match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
    const bin = atob(e.img.slice(comma + 1));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    url = URL.createObjectURL(new Blob([arr], {type:mime}));
  } catch(err){ url = e.img; }
  imgCache.set(e.id, {src:e.img, url:url});
  return url;
}
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1200;
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file could not be opened as a photo. Try a JPEG or PNG.')); };
    img.src = url;
  });
}

/* ---------- photo dates: EXIF DateTimeOriginal, then Pixel-style file names ---------- */
function validIso(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return !!m && +m[1] > 1900 && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31; }
function exifDate(v){
  if (v.getUint16(0) !== 0xFFD8) return null;
  let off = 2;
  while (off + 4 < v.byteLength){
    const marker = v.getUint16(off);
    if ((marker & 0xFF00) !== 0xFF00) return null;
    const len = v.getUint16(off + 2);
    if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) return tiffDate(v, off + 10);
    if (marker === 0xFFDA) return null;
    off += 2 + len;
  }
  return null;
}
function tiffDate(v, t){
  const le = v.getUint16(t) === 0x4949;
  const u16 = o => v.getUint16(o, le);
  const u32 = o => v.getUint32(o, le);
  const readIfd = ifd => {
    const out = {};
    const n = u16(ifd);
    for (let i = 0; i < n; i++){
      const ent = ifd + 2 + i * 12;
      if (ent + 12 > v.byteLength) break;
      out[u16(ent)] = {type: u16(ent + 2), cnt: u32(ent + 4), at: ent + 8};
    }
    return out;
  };
  const strOf = tag => {
    if (!tag || tag.type !== 2) return null;
    const o = tag.cnt > 4 ? t + u32(tag.at) : tag.at;
    let str = '';
    for (let i = 0; i < tag.cnt && o + i < v.byteLength; i++){ const ch = v.getUint8(o + i); if (!ch) break; str += String.fromCharCode(ch); }
    return str;
  };
  const ifd0 = readIfd(t + u32(t + 4));
  let raw = null;
  if (ifd0[0x8769]){ const exif = readIfd(t + u32(ifd0[0x8769].at)); raw = strOf(exif[0x9003]) || strOf(exif[0x9004]); }
  if (!raw) raw = strOf(ifd0[0x0132]);
  const m = raw && /^(\d{4}):(\d{2}):(\d{2})/.exec(raw);
  if (!m) return null;
  const iso = m[1] + '-' + m[2] + '-' + m[3];
  return validIso(iso) ? iso : null;
}
async function photoDate(file){
  try {
    const found = exifDate(new DataView(await file.slice(0, 262144).arrayBuffer()));
    if (found) return found;
  } catch(err){ /* not a JPEG with EXIF; try the file name */ }
  const m = /(20\d{2})(\d{2})(\d{2})[_-]\d{6}/.exec(file.name) || /(20\d{2})-(\d{2})-(\d{2})/.exec(file.name);
  if (m){ const iso = m[1] + '-' + m[2] + '-' + m[3]; if (validIso(iso)) return iso; }
  return null;
}

/* ---------- state ---------- */
const state = {
  events: [],
  filters: new Set(Object.keys(CATS)),
  scale: ZOOM.month,
  t0: 0, t1: 0
};
(function restorePrefs(){
  const f = lsGet('ft-filters');
  if (f){ try { const arr = JSON.parse(f).filter(k => CATS[k]); state.filters = new Set(arr); } catch(err){ /* ignore */ } }
  if (lsGet('ft-has-family') !== '1'){ state.filters.add('family'); lsSet('ft-has-family', '1'); }
  const s = parseFloat(lsGet('ft-scale'));
  if (s >= MIN_SCALE && s <= MAX_SCALE) state.scale = s;
})();

const EXAMPLES = [
  {title:'New bathroom fitted', cat:'home', start:'2026-03-09', end:'2026-03-20', notes:'Tiles from the Leicester showroom. Two weeks without a shower upstairs.'},
  {title:'Half-term in Cornwall', cat:'holiday', start:'2026-05-23', end:'2026-05-30', notes:'Cottage near the harbour. Add the album link once the photos are shared.'},
  {title:'Day at the zoo', cat:'trip', start:'2026-08-08', notes:''},
  {title:'Annual review', cat:'work', start:'2026-09-15', notes:''},
  {title:'Christmas lights trail', cat:'trip', start:'2026-12-12', status:'planned', notes:'Tickets go on sale in November.'},
  {title:'Easter in the Lakes', cat:'holiday', start:'2027-03-27', end:'2027-04-03', status:'booked', notes:''},
  {title:'Replace the garden fence', cat:'home', start:'2027-04-17', end:'2027-04-18', status:'idea', notes:''}
];

/* Events added from photos shared in chat; added once, then editable like any other */
const BUNDLED = [];

/* ---------- rendering ---------- */
function computeRange(){
  const ty = new Date(todayUTC()).getUTCFullYear();
  let minY = ty - 1, maxY = ty + 1;
  state.events.forEach(ev => {
    const ys = new Date(utc(ev.start)).getUTCFullYear();
    const ye = new Date(endOf(ev)).getUTCFullYear();
    if (ys < minY) minY = ys;
    if (ye > maxY) maxY = ye;
  });
  if (tally.on) tally.days.forEach((v, k) => { const y = new Date(k).getUTCFullYear(); if (y < minY) minY = y; if (y > maxY) maxY = y; });
  return {t0: Date.UTC(minY, 0, 1), t1: Date.UTC(maxY + 1, 0, 1)};
}
function yOf(t){ return TOP + (t - state.t0) / DAY * state.scale; }
function tOfY(y){ return state.t0 + (y - TOP) / state.scale * DAY; }

function visibleEvents(){
  return state.events
    .filter(ev => state.filters.has(ev.cat))
    .sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : (b.end || b.start).localeCompare(a.end || a.start));
}

function cardHTML(ev, mode, top, h){
  const st = statusInfo(ev);
  const cls = 'card m-' + mode + ' k-' + st.kind;
  const style = 'top:' + top + 'px;height:' + h + 'px;--c:var(--c-' + ev.cat + ')';
  const title = esc(ev.title);
  const cover = ev.img ? '<img src="' + imgSrc(ev) + '" alt="" loading="lazy">' : '<span class="ph"></span>';
  const meta = '<span class="d">' + esc(fmtRange(ev)) + '</span>';
  const chips = '<span class="st">' + esc(st.label) + '</span>' + (ev.album && mode === 'week' ? '<span class="alb">Album</span>' : '') + (ev.example ? '<span class="ex">Example</span>' : '');
  const notes = mode === 'week' && ev.notes ? '<span class="n">' + esc(ev.notes) + '</span>' : '';
  return '<button type="button" class="' + cls + '" data-id="' + esc(ev.id) + '" style="' + style + '"><span class="cov">' + cover + '</span><span class="body"><span class="t">' + title + '</span>' + meta + notes + '<span class="row">' + chips + '</span></span></button>';
}

function render(){
  const range = computeRange();
  state.t0 = range.t0; state.t1 = range.t1;
  const sc = state.scale;
  const mode = modeOf(sc);
  const parts = [];

  // axis ticks
  const yStart = new Date(state.t0).getUTCFullYear(), yEnd = new Date(state.t1).getUTCFullYear();
  const showMonths = sc * 30 >= 24;
  for (let yr = yStart; yr < yEnd; yr++){
    for (let m = 0; m < 12; m++){
      const t = Date.UTC(yr, m, 1);
      if (m === 0) parts.push('<div class="tick tick-year" style="top:' + yOf(t) + 'px"><span class="lab">' + yr + '</span></div>');
      else if (showMonths) parts.push('<div class="tick tick-month" style="top:' + yOf(t) + 'px"><span class="lab">' + fmt(t, {month:'short'}) + '</span></div>');
    }
  }
  if (sc >= 30){
    for (let t = state.t0; t < state.t1; t += DAY){
      const d = new Date(t);
      if (d.getUTCDate() === 1) continue;
      parts.push('<div class="tick tick-day' + (d.getUTCDay() === 1 ? ' is-mon' : '') + '" style="top:' + yOf(t) + 'px"><span class="lab">' + fmt(t, {weekday:'short'}) + ' ' + d.getUTCDate() + '</span></div>');
    }
  } else if (sc >= 8){
    const dow = new Date(state.t0).getUTCDay();
    for (let t = state.t0 + ((8 - dow) % 7) * DAY; t < state.t1; t += 7 * DAY){
      const d = new Date(t);
      if (d.getUTCDate() === 1) continue;
      parts.push('<div class="tick tick-week" style="top:' + yOf(t) + 'px"><span class="lab">' + d.getUTCDate() + '</span></div>');
    }
  }

  // events: duration bars in lanes beside the axis
  const showTally = tally.on && tally.show;
  const list = showTally ? [] : visibleEvents();
  const laneEnds = [];
  const laneOf = {};
  list.forEach(ev => {
    const s = utc(ev.start), en = endOf(ev);
    let lane = laneEnds.findIndex(le => le < s);
    if (lane === -1){
      if (laneEnds.length < 3){ lane = laneEnds.length; laneEnds.push(en); }
      else { lane = 2; laneEnds[2] = Math.max(laneEnds[2], en); }
    } else laneEnds[lane] = en;
    laneOf[ev.id] = lane;
    const dy = yOf(s);
    parts.push('<div class="bar k-' + statusInfo(ev).kind + '" style="--c:var(--c-' + ev.cat + ');left:' + (62 + lane * 8) + 'px;top:' + dy + 'px;height:' + Math.max(yOf(en + DAY) - dy, 4) + 'px"></div>');
  });

  if (showTally) renderTally(parts, mode, sc);

  let bottom = 0;
  if (mode === 'year') bottom = layoutTiles(list, parts);
  else bottom = layoutCards(list, laneOf, mode, parts);

  const today = todayUTC();
  if (today >= state.t0 && today < state.t1) parts.push('<div class="today" style="top:' + yOf(today) + 'px"><span>Today</span></div>');
  if (!list.length && !showTally) parts.push('<p class="empty">' + (state.events.length ? 'Nothing to show. Turn a category back on above.' : 'Tap + Add to put your first event on the timeline.') + '</p>');

  tl.innerHTML = parts.join('');
  tl.style.height = Math.max(yOf(state.t1) + TOP, bottom + 80) + 'px';

  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.zoom === mode));
  renderFilters();
  renderBanners();
}

function layoutCards(list, laneOf, mode, parts){
  const h = CARD_H[mode], off = CARD_OFF[mode], gap = GAP[mode];
  let prevBottom = -Infinity;
  list.forEach(ev => {
    const cvar = '--c:var(--c-' + ev.cat + ')';
    const dy = yOf(utc(ev.start));
    const top = Math.max(dy - off, prevBottom + gap);
    prevBottom = top + h;
    const joinY = top + off;
    const x0 = 62 + laneOf[ev.id] * 8 + 5;
    if (joinY - dy < 1.5){
      parts.push('<div class="link" style="' + cvar + ';left:' + x0 + 'px;width:' + (100 - x0) + 'px;top:' + dy + 'px"></div>');
    } else {
      parts.push('<div class="elbow" style="' + cvar + ';left:' + x0 + 'px;width:' + (92 - x0) + 'px;top:' + dy + 'px;height:' + (joinY - dy) + 'px"></div>');
      parts.push('<div class="link" style="' + cvar + ';left:92px;width:8px;top:' + joinY + 'px"></div>');
    }
    parts.push(cardHTML(ev, mode, top, h));
  });
  return prevBottom;
}

/* Years zoom: photo tiles placed by priority, staggered sideways, nudged up or down, then shrunk or dropped */
function layoutTiles(list, parts){
  const W = Math.max(160, tl.clientWidth - 100);
  const dims = {
    L: Math.round(Math.min(150, W * 0.5)),
    M: Math.round(Math.min(96, W * 0.32)),
    S: Math.round(Math.min(56, W * 0.2))
  };
  const placed = [];
  const hidden = {};
  let bottom = 0;
  const fits = (x, y, w, h) => placed.every(r => x + w + 4 <= r.x || r.x + r.w + 4 <= x || y + h + 4 <= r.y || r.y + r.h + 4 <= y);
  const tryPlace = (dy, size) => {
    const w = dims[size], h = Math.round(w * 0.75), y0 = dy - h / 2;
    for (let step = 0; step <= MAX_SHIFT[size]; step += 6){
      const offs = step ? [step, -step] : [0];
      for (const o of offs){
        const y = y0 + o;
        if (y < 4) continue;
        for (let x = 0; x + w <= W; x += 10){ if (fits(x, y, w, h)) return {x:x, y:y, w:w, h:h, size:size}; }
      }
    }
    return null;
  };
  list.slice().sort(prioCompare).forEach(ev => {
    const want = sizeOf(ev);
    const dy = yOf(utc(ev.start));
    let spot = tryPlace(dy, want);
    if (!spot && want === 'L') spot = tryPlace(dy, 'M');
    if (!spot && want !== 'S') spot = tryPlace(dy, 'S');
    if (!spot){
      const d = new Date(utc(ev.start));
      const key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      hidden[key] = (hidden[key] || 0) + 1;
      return;
    }
    placed.push(spot);
    bottom = Math.max(bottom, spot.y + spot.h);
    const st = statusInfo(ev);
    const inner = ev.img ? '<img src="' + imgSrc(ev) + '" alt="" loading="lazy">' : '<span class="ph"></span>';
    const cap = spot.size === 'L' ? '<span class="cap"><b>' + esc(ev.title) + '</b><i>' + esc(fmt(utc(ev.start), {day:'numeric', month:'short'})) + '</i></span>'
      : spot.size === 'M' ? '<span class="cap"><b>' + esc(ev.title) + '</b></span>' : '';

/* ---------- zoom ---------- */
function setScale(ns, anchorClientY){
  ns = clamp(ns, MIN_SCALE, MAX_SCALE);
  const rect = tl.getBoundingClientRect();
  const docTop = rect.top + window.scrollY;
  const anchorT = tOfY(anchorClientY - rect.top);
  state.scale = ns;
  render();
  window.scrollTo(0, docTop + yOf(anchorT) - anchorClientY);
  lsSet('ft-scale', String(ns));
}
function viewportMid(){
  const deck = document.querySelector('.deck').getBoundingClientRect();
  return deck.bottom + (window.innerHeight - deck.bottom) / 2;
}
function scrollToDate(t){
  const rect = tl.getBoundingClientRect();
  window.scrollTo({top: rect.top + window.scrollY + yOf(t) - viewportMid(), behavior:'smooth'});
}

let pinch = null, pendingZoom = null, raf = 0;
function touchDist(ts){ return Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY); }
tl.addEventListener('touchstart', e => {
  if (e.touches.length === 2) pinch = {d0: touchDist(e.touches) || 1, s0: state.scale};
}, {passive:true});
tl.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  pendingZoom = {s: pinch.s0 * touchDist(e.touches) / pinch.d0, y: (e.touches[0].clientY + e.touches[1].clientY) / 2};
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (pendingZoom) setScale(pendingZoom.s, pendingZoom.y); });
}, {passive:false});
tl.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
tl.addEventListener('touchcancel', () => { pinch = null; });
tl.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setScale(state.scale * Math.exp(-e.deltaY * 0.004), e.clientY);
}, {passive:false});

});

function applyPhotoDates(dates, count){
  const note = document.getElementById('f-photo-note');
  if (!note) return;
  if (!dates.length){
    note.textContent = (count > 1 ? 'These photos have' : 'This photo has') + ' no date saved in it, so set the dates yourself.';
    return;
  }
  const from = dates[0], to = dates[dates.length - 1];
  const label = fmtRange({start:from, end: to === from ? '' : to});
  if (!datesTouched){
    document.getElementById('f-start').value = from;
    document.getElementById('f-end').value = to === from ? '' : to;
    note.textContent = 'Dates set from ' + (count > 1 ? 'photos' : 'photo') + ': ' + label + '.';
  } else {
    note.innerHTML = 'Taken ' + esc(label) + '. <button type="button" class="btn" style="padding:4px 10px;margin-left:4px" data-act="use-photo-dates" data-from="' + from + '" data-to="' + (to === from ? '' : to) + '">Use these dates</button>';
  }
}

function showFormError(msg){
  const el = document.getElementById('f-err');
  if (!el) return;
  el.textContent = msg; el.hidden = !msg;
}

async function saveForm(form){
  const id = form.dataset.id;
  const title = document.getElementById('f-title').value.trim();
  const catEl = form.querySelector('input[name="cat"]:checked');
  const stEl = form.querySelector('input[name="status"]:checked');
  const sizeEl = form.querySelector('input[name="size"]:checked');
  const start = document.getElementById('f-start').value;
  let end = document.getElementById('f-end').value;
  const album = document.getElementById('f-album').value.trim();
  if (!title) return showFormError('Give the event a name.');
  if (!start) return showFormError('Pick a start date.');
  if (end && end < start) return showFormError('The end date is before the start date.');
  if (end === start) end = '';
  if (album && !/^https:\/\//i.test(album)) return showFormError('The photos link should start with https://');
  const prev = id ? findEvent(id) : null;
  const ev = {
    id: prev ? prev.id : uid(),
    title: title,
    cat: catEl ? catEl.value : 'holiday',
    start: start,
    end: end,
    status: stEl ? stEl.value : 'planned',
    notes: document.getElementById('f-notes').value.trim(),
    album: album,
    img: formImg || '',
    size: sizeEl ? sizeEl.value : 'M',
    updated: Date.now()
  };
  if (prev && typeof prev.rank === 'number' && sizeOf(prev) === ev.size) ev.rank = prev.rank;
  try { await dbPut(ev); }
  catch(err){ return showFormError('Could not save: ' + (err && err.message ? err.message : 'storage error') + '. Try again.'); }
  if (prev) state.events[state.events.indexOf(prev)] = ev; else state.events.push(ev);
  closeSheet();
  render();
  scrollToDate(utc(ev.start));
  toast(prev ? 'Saved' : 'Added to timeline');
}

async function deleteEvent(id){
  try { await dbDel(id); }
  catch(err){ toast('Could not delete. Try again.'); return; }
  state.events = state.events.filter(ev => ev.id !== id);
  imgCache.delete(id);
  closeSheet();
  render();
  toast('Deleted');
}

async function clearExamples(){
  const ids = state.events.filter(ev => ev.example).map(ev => ev.id);
  try { await dbWrite(st => { ids.forEach(i => st.delete(i)); }); }
  catch(err){ toast('Could not remove examples. Try again.'); return; }
  state.events = state.events.filter(ev => !ev.example);
  lsSet('ft-seeded', '1');
  closeSheet();
  render();
  toast('Examples removed');
}

/* ---------- Years zoom priorities (drag to rank) ---------- */
const HANDLE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="2" rx="1"/><rect x="4" y="11" width="16" height="2" rx="1"/><rect x="4" y="16" width="16" height="2" rx="1"/></svg>';
let prioYear = null;
function eventYears(){
  return Array.from(new Set(state.events.map(ev => +ev.start.slice(0, 4)))).sort((a, b) => b - a);
}
function openPrio(){
  const years = eventYears();
  if (!years.length){ toast('Add some events first'); return; }
  const ty = new Date(todayUTC()).getUTCFullYear();
  if (prioYear === null || years.indexOf(prioYear) === -1) prioYear = years.indexOf(ty) !== -1 ? ty : years[0];
  openSheet(
    '<h2>Years zoom priorities</h2>' +
    '<p class="hint">Drag the handle to rank events. Large ones get the biggest photos at Years zoom. When a year gets crowded, Small ones are shrunk or dropped first, then the lowest in each group.</p>' +
    '<div class="field"><label for="p-year">Year</label><select id="p-year" class="sel">' + years.map(y => '<option value="' + y + '"' + (y === prioYear ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></div>' +
    '<ul class="prio" id="prio-list"></ul>' +
    '<div class="btn-row"><button type="button" class="btn primary wide" data-act="close">Done</button></div>',
    'Years zoom priorities'
  );
  fillPrioList();
}
function fillPrioList(){
  const ul = document.getElementById('prio-list');
  if (!ul) return;
  const evs = state.events.filter(ev => +ev.start.slice(0, 4) === prioYear).sort(prioCompare);
  const head = k => '<li class="ph-head" data-size="' + k + '">' + SIZES[k] + (k === 'S' ? ' <small>(first to drop when crowded)</small>' : '') + '</li>';
  const item = ev => '<li class="pi" data-id="' + esc(ev.id) + '" style="--c:var(--c-' + ev.cat + ')"><button type="button" class="handle" aria-label="Drag to reorder ' + esc(ev.title) + '">' + HANDLE_SVG + '</button><span class="thumb">' + (ev.img ? '<img src="' + imgSrc(ev) + '" alt="">' : '<span class="ph"></span>') + '</span><span class="pt"><b>' + esc(ev.title) + '</b><small>' + esc(fmtRange(ev)) + '</small></span></li>';
  ul.innerHTML = ['L', 'M', 'S'].map(k => head(k) + evs.filter(ev => sizeOf(ev) === k).map(item).join('')).join('');
}
sheet.addEventListener('change', e => {
  if (e.target.id === 'p-year'){ prioYear = +e.target.value; fillPrioList(); }
});

let drag = null;
sheet.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle');
  if (!h) return;
  const li = h.closest('.pi');
  e.preventDefault();
  const r = li.getBoundingClientRect();
  const gapEl = document.createElement('li');
  gapEl.className = 'pi-gap';
  gapEl.style.height = r.height + 'px';
  li.after(gapEl);
  li.classList.add('dragging');
  li.style.width = r.width + 'px';
  li.style.left = r.left + 'px';
  li.style.top = r.top + 'px';
  drag = {li: li, gap: gapEl, dy: e.clientY - r.top, y: e.clientY, timer: 0};
  try { h.setPointerCapture(e.pointerId); } catch(err){ /* fine without capture */ }
  drag.timer = setInterval(autoScrollSheet, 30);
});
function autoScrollSheet(){
  if (!drag) return;
  const r = sheet.getBoundingClientRect();
  if (drag.y < r.top + 60) sheet.scrollTop -= 10;
  else if (drag.y > r.bottom - 60) sheet.scrollTop += 10;
  else return;
  placeGap(drag.y);
}
function placeGap(y){
  const ul = document.getElementById('prio-list');
  const kids = Array.from(ul.children).filter(c => c !== drag.li && c !== drag.gap);
  for (const c of kids){
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2){
      if (c.classList.contains('ph-head') && c.dataset.size === 'L') c.after(drag.gap);
      else c.before(drag.gap);
      return;
    }
  }
  ul.appendChild(drag.gap);
}
sheet.addEventListener('pointermove', e => {
  if (!drag) return;
  e.preventDefault();
  drag.y = e.clientY;
  drag.li.style.top = (e.clientY - drag.dy) + 'px';
  placeGap(e.clientY);
});
function endDrag(){
  if (!drag) return;
  clearInterval(drag.timer);
  drag.li.classList.remove('dragging');
  drag.li.style.width = drag.li.style.left = drag.li.style.top = '';
  drag.gap.replaceWith(drag.li);
  drag = null;
  savePrioOrder();

/* ---------- cloud sync (Firebase Realtime Database, signed-in users only) ----------
   IndexedDB stays the working copy, so the app still opens and saves offline.

                        Deleted events become {deleted:true, updated} so an
                        offline phone can't bring them back.
     photos/<hash>      the compressed photo (data URL), stored once per photo
                        and fetched once per phone.
     backups/daily/<d>  copy of events/ once a day (photos are never deleted).
   Merge rule: newest `updated` wins, per event. Nothing is wiped on first sync:
   events only on this phone are uploaded, events only in the cloud come down.
   Example events never sync. Bundled events are stamped updated:0, so a
   delete or edit made on another phone wins over them. */

function dirtyGet(){ try { return JSON.parse(lsGet(SYNC_DIRTY) || '{}') || {}; } catch(e){ return {}; } }

function photosKnown(){ try { return new Set(JSON.parse(lsGet(SYNC_PHOTOS) || '[]')); } catch(e){ return new Set(); } }

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(img));
  return Array.from(new Uint8Array(buf).slice(0, 12), b => b.toString(16).padStart(2, '0')).join('');

function cloudCopy(ev, hash){
  const c = {};
  Object.keys(ev).forEach(k => { if (k !== 'img' && k !== 'example' && ev[k] !== undefined) c[k] = ev[k]; });
  c.imgHash = hash || '';

function syncFail(err){

// Called after every local save or delete (via dbPutMany / dbDel).
function syncQueue(ids, deleted){
  if (!FB_CONFIG) return;
  const d = dirtyGet(), now = Date.now();
  ids.forEach(id => { const ev = findEvent(id); if (deleted || !ev || !ev.example) d[id] = deleted ? -now : now; });
  dirtySet(d);
  // callers update state.events right after the save resolves; upload after that
  setTimeout(syncFlush, 0);
}

async function syncFlush(){
  if (!sync.ready || !sync.online || !sync.user){ syncStatus(); return; }
  if (sync.flushing){ sync.again = true; return; }
  sync.flushing = true; syncStatus();
  try {
    const d = dirtyGet();
    const known = photosKnown();
    for (const id of Object.keys(d)){
      const ev = d[id] < 0 ? null : findEvent(id);
      let val = null;
      if (!ev) val = {deleted:true, updated:Math.abs(d[id])};
      else if (!ev.example){
        let h = '';
        if (ev.img){
          h = ev.imgHash || await photoHash(ev.img);
          if (!known.has(h)){ await sync.D.set(fbRef('photos/' + h), ev.img); known.add(h); photosKnownSave(known); }
          if (ev.imgHash !== h){ ev.imgHash = h; await rawPutMany([ev]); }
        }
        val = cloudCopy(ev, h);
      }
      if (val) await sync.D.set(fbRef('events/' + id), val);
      const cur = dirtyGet();
      if (cur[id] === d[id]){ delete cur[id]; dirtySet(cur); }
    }
    sync.error = '';
  } catch(err){ syncFail(err); }
  sync.flushing = false;
  syncStatus();
  if (sync.again){ sync.again = false; syncFlush(); }
}

async function syncOnRemote(remote){
  remote = remote && typeof remote === 'object' ? remote : {};
  const d = dirtyGet();
  const known = photosKnown();
  const take = [], dels = [], push = [];
  Object.keys(remote).forEach(id => {
    const r = remote[id];
    if (!r || typeof r !== 'object') return;
    const loc = findEvent(id);
    const rt = r.updated || 0;
    const lt = d[id] < 0 ? -d[id] : loc ? (loc.updated || 0) : Math.abs(d[id] || 0);
    if (d[id] && rt <= lt) return; // our pending change is newer; flush sends it
    if (d[id]){ const cur = dirtyGet(); delete cur[id]; dirtySet(cur); }    // theirs is newer: drop ours
    if (r.deleted){
      if (loc && !loc.example){ if (lt <= rt) dels.push(id); else push.push(id); }
      return;
    }
    if (loc && lt > rt){ push.push(id); return; }
    if (loc && lt === rt) return;
    if (!r.title || !/^\d{4}-\d{2}-\d{2}$/.test(r.start || '')) return;
    take.push({r:r, loc:loc});
  });
  // events only on this phone go up (never thrown away)
  state.events.forEach(ev => { if (!ev.example && !remote[ev.id] && !d[ev.id]) push.push(ev.id); });

  const fresh = await Promise.all(take.map(async x => {
    const ev = Object.assign({}, x.r);
    delete ev.deleted;
    ev.img = '';
    if (x.r.imgHash){
      if (x.loc && x.loc.img && x.loc.imgHash === x.r.imgHash) ev.img = x.loc.img;
      else {
        const s = await sync.D.get(fbRef('photos/' + x.r.imgHash));
        ev.img = typeof s.val() === 'string' ? s.val() : '';
        if (ev.img) known.add(x.r.imgHash);
      }
    }
    return ev;
  }));
  photosKnownSave(known);
  if (fresh.length || dels.length){
    await rawPutMany(fresh);
    await rawDelMany(dels);
    const byId = new Map(state.events.map(ev => [ev.id, ev]));
    fresh.forEach(ev => byId.set(ev.id, ev));
    dels.forEach(id => { byId.delete(id); imgCache.delete(id); });
    state.events = Array.from(byId.values());
    syncRender();
  }
  if (push.length){
    const cur = dirtyGet(), now = Date.now();
    push.forEach(id => { if (!cur[id]) cur[id] = now; });
    dirtySet(cur);
  }
}

async function syncStart(){
  if (!FB_CONFIG || sync.db || sync.starting) return;
  sync.starting = true; syncStatus();
  try {
    const mods = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-database.js')]);
    const app = mods[0].initializeApp(FB_CONFIG, 'timeline');
    sync.A = mods[1]; sync.D = mods[2];
    sync.auth = sync.A.getAuth(app);
    sync.db = sync.D.getDatabase(app);
  } catch(err){ sync.starting = false; syncStatus(); return; } // offline at launch: retried on 'online'
  sync.starting = false;
  sync.D.onValue(sync.D.ref(sync.db, '.info/connected'), s => {
    sync.online = !!s.val(); syncStatus();
    if (sync.online) syncFlush();
  });
  sync.A.onAuthStateChanged(sync.auth, user => {
    if (sync.unsub){ sync.unsub(); sync.unsub = null; }
    sync.user = user; sync.ready = false; sync.error = '';
    if (user){
      sync.unsub = sync.D.onValue(fbRef('events'), snap => {
        const val = snap.val();
        sync.chain = sync.chain.then(() => syncOnRemote(val)).then(() => {
          if (!sync.ready){ sync.ready = true; dailyBackup(val); }
          syncFlush();
        }).catch(syncFail);
      }, syncFail);
    }
    syncStatus();
  });
}

/* ---------- Tally (secret filter, same PIN as Tally) ----------
   Tally lives on the same origin (bengalebg23.github.io), so its PIN-wrapped vault
   (localStorage 'tally.vault') is readable here. The PIN unwraps it, the newer of
   Tally's local cache and its synced Firebase copy is decrypted, and sessions are
   held in memory only: nothing decrypted is ever stored, and nothing of Tally's is
   written except its shared wrong-PIN counter, so the lockout applies here too.
   Long-press the title to unlock or lock. Locks again after 60 s in the background. */
const TALLY = {vault:'tally.vault', blob:'tally.blob', fails:'tally.fails', iter:310000,
  db:'https://tally-85dd6-default-rtdb.europe-west1.firebasedatabase.app'};

function tallyFails(){ try { return JSON.parse(lsGet(TALLY.fails)) || {n:0, until:0}; } catch(err){ return {n:0, until:0}; } }

async function tallyPinKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', tEnc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:TALLY.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function tallyFetch(vid){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(TALLY.db + '/vaults/' + vid + '.json', {cache:'no-store', signal:ctl.signal});
    return r.ok ? await r.json() : null;
  } catch(err){ return null; } finally { clearTimeout(timer); }
}
async function tallyUnlock(pin){
  const rec = tallyRec();

  const f = tallyFails(), now = Date.now();

  let raw;
  try { raw = await tallyDecrypt(await tallyPinKey(pin, tB64(rec.salt)), rec); }
  catch(err){
    f.n++; if (f.n >= 5) f.until = now + 30000 * Math.pow(2, f.n - 5);

function tallyLoad(d){
  const groups = {};

    if (g && g.id) groups[g.id] = {name: String(g.name || ''), color: (window.CSS && CSS.supports('color', g.color || '')) ? g.color : '#8896A6'};
  });

  let count = 0;
  (Array.isArray(d.sessions) ? d.sessions : []).forEach(x => {
    if (!x || typeof x.t !== 'number') return;
    const dt = new Date(x.t);
    const k = Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate());
    if (!days.has(k)) days.set(k, []);
    days.get(k).push({k:-1, t:x.t, g:x.g, tags: Array.isArray(x.tags) ? x.tags.map(String) : [], note: String(x.note || '')});

function tallyLock(){

function tallyTagLabel(key){

// colour index = first picked tag the session carries, in pick order; -1 = not shown
function tallyClassify(){
  tally.days.forEach(a => a.forEach(x => { x.k = tally.sel.findIndex(key => { const p = key.split('\u0001'); return p[0] === x.g && x.tags.indexOf(p[1]) !== -1; }); }));
}
function tallyDefaultSel(){
  const find = re => { const t = tally.tags.find(x => re.test(x.t)); return t ? t.key : null; };
  const out = [find(/^piv$/i), find(/^m[\s-]?orgasm$/i)].filter(Boolean);
  tally.tags.forEach(t => { if (out.length < 2 && out.indexOf(t.key) === -1) out.push(t.key); });
  return out;
}
async function tallyLoadSel(){
  let sel = null;
  try {
    const o = JSON.parse(lsGet(TALLY_SEL));
    if (o && o.ct) sel = JSON.parse(tDec.decode(await tallyDecrypt(tally.key, o)));
  } catch(err){ sel = null; }
  const known = new Set(tally.tags.map(t => t.key));
  tally.sel = Array.isArray(sel) ? sel.filter(k => known.has(k)).slice(0, TALLY_MAX) : [];
  if (!Array.isArray(sel)) tally.sel = tallyDefaultSel();
  tallyClassify();
}
async function tallySaveSel(){
  if (!tally.key) return;
  try {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, tally.key, tEnc.encode(JSON.stringify(tally.sel)));
    const b64 = u => { let out = ''; new Uint8Array(u).forEach(x => { out += String.fromCharCode(x); }); return btoa(out); };
    lsSet(TALLY_SEL, JSON.stringify({iv:b64(iv), ct:b64(ct)}));
  } catch(err){ /* selection just won't be remembered */ }
}
function openTallyTags(){
  if (!tally.on) return;
  const byG = {};
  tally.tags.forEach(t => { (byG[t.g] = byG[t.g] || []).push(t); });
  const body = Object.keys(byG).map(g => '<div class="tgrp"><h3>' + esc((tally.groups[g] || {}).name || 'Other') + '</h3><div class="ttaglist">' +
    byG[g].map(t => { const i = tally.sel.indexOf(t.key); return '<button type="button" class="ttag' + (i >= 0 ? ' tk-' + i : '') + '" data-act="ttag" data-key="' + esc(encodeURIComponent(t.key)) + '" aria-pressed="' + (i >= 0) + '">' + esc(t.t) + ' <span class="n">' + t.n + '</span></button>'; }).join('') +
    '</div></div>').join('');
  openSheet('<h2>Tags to show</h2><p class="hint">Pick up to ' + TALLY_MAX + '. A session takes the colour of the first picked tag it has; sessions without a picked tag are hidden.</p>' + body +
    '<div class="btn-row"><button type="button" class="btn primary wide" data-act="close">Done</button></div>', 'Tally tags');
  tally.sheetOpen = true;
}
function tallyToggleTag(key, btn){
  const i = tally.sel.indexOf(key);
  if (i >= 0) tally.sel.splice(i, 1);
  else if (tally.sel.length >= TALLY_MAX){ toast('Up to ' + TALLY_MAX + ' tags'); return; }
  else tally.sel.push(key);
  tallyClassify(); tallySaveSel();
  const top = sheet.scrollTop;
  setTimeout(() => { render(); openTallyTags(); sheet.scrollTop = top; }, 0);
}
function tallyDotsHTML(list){
  return list.filter(x => x.k >= 0).sort((a, b) => a.k - b.k || a.t - b.t).map(x => '<i class="tk-' + x.k + '"></i>').join('');
}
/* Full width: Years = each month's sessions as a grid of dots in its band;
   Months/Weeks = one row of dots per day. Tap a row or block for the list. */
function renderTally(parts, mode, sc){
  if (mode === 'year'){
    const months = new Map();
    tally.days.forEach((list, k) => {
      const d = new Date(k), m = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      if (!months.has(m)) months.set(m, []);
      Array.prototype.push.apply(months.get(m), list);
    });
    months.forEach((all, m) => {
      const list = all.filter(x => x.k >= 0);
      if (!list.length) return;
      const d = new Date(m), next = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
      const y0 = yOf(m) + 20, h = Math.max(10, yOf(next) - yOf(m) - 24);
      const dot = sc < 2.5 ? 6 : 8;
      parts.push('<button type="button" class="trowb" data-from="' + m + '" data-to="' + (next - DAY) + '" style="--d:' + dot + 'px;--g:3px;top:' + y0 + 'px;height:' + h + 'px" aria-label="' + list.length + ' in ' + fmt(m, {month:'long', year:'numeric'}) + '">' + tallyDotsHTML(list) + '</button>');
    });
    return;
  }
  const dot = Math.max(4, Math.min(mode === 'week' ? 14 : 8, sc - 1));
  const xAt = f => 'calc(56px + (100% - 56px - ' + dot + 'px) * ' + f + ' + ' + (dot / 2) + 'px)';
  [6, 12, 18].forEach(h => parts.push('<div class="tgrid" style="left:' + xAt(h / 24) + '"></div>'));
  const y0 = new Date(state.t0).getUTCFullYear(), y1 = new Date(state.t1).getUTCFullYear();
  for (let yr = y0; yr < y1; yr++) for (let m = 0; m < 12; m++){
    const top = yOf(Date.UTC(yr, m, 1)) + 4;
    [6, 12, 18].forEach(h => parts.push('<span class="thr" style="top:' + top + 'px;left:' + xAt(h / 24) + '">' + String(h).padStart(2, '0') + '</span>'));
  }
  tally.days.forEach((all, k) => {
    const list = all.filter(x => x.k >= 0);
    if (!list.length) return;
    const dots = list.map(x => { const d = new Date(x.t); return '<i class="tk-' + x.k + '" style="--x:' + ((d.getHours() * 60 + d.getMinutes()) / 1440).toFixed(4) + '"></i>'; }).join('');
    parts.push('<button type="button" class="trowb tod" data-from="' + k + '" data-to="' + k + '" style="--d:' + dot + 'px;top:' + yOf(k) + 'px;height:' + sc + 'px" aria-label="' + list.length + ' on ' + fmt(k, {day:'numeric', month:'long'}) + '">' + dots + '</button>');
  });
}
function openTallyList(from, to){
  if (!tally.on) return;
  const keys = Array.from(tally.days.keys()).filter(k => k >= from && k <= to).sort((a, b) => a - b);
  const n = keys.reduce((s, k) => s + tally.days.get(k).length, 0);
  const title = from === to ? fmt(from, {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : fmt(from, {month:'long', year:'numeric'});
  const body = keys.map(k => '<div class="tday"><h3>' + esc(fmt(k, {weekday:'short', day:'numeric', month:'short'})) + '</h3>' +
    tally.days.get(k).map(x => {
      const dt = new Date(x.t), g = tally.groups[x.g];
      const extra = [x.tags.join(', '), x.note].filter(Boolean).join(' · ');
      return '<div class="trow tk-' + (x.k >= 0 ? x.k : 'x') + '"><span class="tm">' + String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0') + '</span><span class="tg">' + esc(g ? g.name : '—') + '</span>' + (extra ? '<span class="tx">' + esc(extra) + '</span>' : '') + '</div>';
    }).join('') + '</div>').join('');
  openSheet('<h2>' + esc(title) + '</h2><p class="hint">' + n + ' in Tally</p>' + body +
    '<div class="btn-row"><button type="button" class="btn wide" data-act="close">Close</button></div>', 'Tally');
  tally.sheetOpen = true;
}
function openTallyPad(){
  const rec = tallyRec();
  if (!rec) return;   // stays secret on phones without Tally
  tallyPad = {pin:'', len: rec.n || 0, busy:false};
  const keys = [1,2,3,4,5,6,7,8,9].map(d => '<button type="button" data-act="tp" data-d="' + d + '">' + d + '</button>').join('') +
    '<button type="button" data-act="tp" data-d="back" aria-label="Delete">⌫</button><button type="button" data-act="tp" data-d="0">0</button>' +
    (tallyPad.len ? '<span></span>' : '<button type="button" data-act="tp" data-d="ok" aria-label="Done">✓</button>');
  openSheet('<h2>Tally</h2><p class="hint">Enter your Tally PIN</p><div class="tdots" id="tp-dots"></div><p class="err" id="tp-err" role="alert"></p><div class="tpad">' + keys + '</div>', 'Tally PIN');
  tallyDraw();
}
function tallyDraw(){
  const el = document.getElementById('tp-dots');
  if (!el || !tallyPad) return;
  const n = tallyPad.len || Math.max(4, tallyPad.pin.length);
  el.innerHTML = Array.from({length:n}, (_, i) => '<i class="' + (i < tallyPad.pin.length ? 'f' : '') + '"></i>').join('');
}
async function tallyPress(k){
  const pad = tallyPad;
  if (!pad || pad.busy) return;
  const err = document.getElementById('tp-err');
  if (k === 'back') pad.pin = pad.pin.slice(0, -1);
  else if (k !== 'ok' && pad.pin.length < 8) pad.pin += k;
  tallyDraw();
  const ready = pad.len ? pad.pin.length === pad.len : (k === 'ok' && pad.pin.length >= 4);
  if (!ready) return;
  pad.busy = true; if (err) err.textContent = '…';
  const msg = await tallyUnlock(pad.pin);
  if (tallyPad !== pad) return;
  pad.busy = false; pad.pin = '';
  if (msg){ if (err) err.textContent = msg; tallyDraw(); return; }
  closeSheet();
  render();
  toast('Tally unlocked · ' + tally.count + ' sessions');
}
(function tallyGesture(){
  const h1 = document.querySelector('.deck h1');
  let timer = 0, sx = 0, sy = 0;
  const cancel = () => { clearTimeout(timer); timer = 0; };
  h1.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY; cancel();
    timer = setTimeout(() => { timer = 0; if (tally.on){ tallyLock(); toast('Tally locked'); } else openTallyPad(); }, 700);
  });
  h1.addEventListener('pointermove', e => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => h1.addEventListener(t, cancel));
  h1.addEventListener('contextmenu', e => e.preventDefault());
})();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) tally.hiddenAt = Date.now();
  else if (tally.on && Date.now() - tally.hiddenAt > 60000) tallyLock();
});

async function start(){
  try {
    state.events = await dbAll();
  } catch(err){
    storageOK = false;
    state.events = [];
  }
  if (!state.events.length && lsGet('ft-seeded') !== '1'){
    const seeded = EXAMPLES.map((x, i) => Object.assign({id:'ex' + i, end:'', status:'planned', album:'', img:'', example:true}, x));
    state.events = seeded;
    try { await rawPutMany(seeded); lsSet('ft-seeded', '1'); } catch(err){ /* shown in memory only */ }
  }
  let imported = [];
  try { imported = JSON.parse(lsGet('ft-imported') || '[]'); } catch(err){ imported = []; }
  const have = new Set(state.events.map(ev => ev.id));
  const fresh = BUNDLED.filter(b => !have.has(b.id) && imported.indexOf(b.id) === -1).map(b => Object.assign({updated: 0}, b));
  if (fresh.length){
    state.events = state.events.concat(fresh);
    try { await rawPutMany(fresh); lsSet('ft-imported', JSON.stringify(imported.concat(fresh.map(b => b.id)))); } catch(err){ /* shown in memory only */ }
  }
  render();
  const rect = tl.getBoundingClientRect();
  window.scrollTo(0, rect.top + window.scrollY + yOf(todayUTC()) - viewportMid());
}
start().then(() => { syncStatus(); syncStart(); });

if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
